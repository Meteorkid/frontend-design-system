# Penpot 自托管部署
# 参考：https://penpot.app/self-hosting
# 5 个服务：frontend, backend, exporter, postgres, redis

services:
  penpot-frontend:
    image: penpotapp/frontend:latest
    restart: always
    ports:
      - "9001:80"
    depends_on:
      - penpot-backend
    environment:
      - PENPOT_PUBLIC_URI=http://localhost:9001
      - PENPOT_FLAGS=enable-registration enable-login-with-password disable-email-verification enable-smtp

  penpot-backend:
    image: penpotapp/backend:latest
    restart: always
    depends_on:
      - penpot-postgres
      - penpot-redis
    environment:
      - PENPOT_PUBLIC_URI=http://localhost:9001
      - PENPOT_SECRET_KEY=my-super-secret-key-change-me
      - PENPOT_FLAGS=enable-registration enable-login-with-password disable-email-verification enable-smtp
      - PENPOT_DATABASE_URI=postgresql://penpot-postgres/penpot
      - PENPOT_DATABASE_USERNAME=penpot
      - PENPOT_DATABASE_PASSWORD=penpot
      - PENPOT_REDIS_URI=redis://penpot-redis/0
      - PENPOT_ASSETS_STORAGE_BACKEND=assets-fs
      - PENPOT_STORAGE_ASSETS_FS_DIRECTORY=/opt/data/assets
      - PENPOT_TELEMETRY_ENABLED=false
      - PENPOT_SMTP_DEFAULT_FROM=no-reply@penpot.local
      - PENPOT_SMTP_DEFAULT_REPLY_TO=no-reply@penpot.local
      - PENPOT_SMTP_HOST=penpot-mailcatch
      - PENPOT_SMTP_PORT=1025
      - PENPOT_SMTP_TLS=false
      - PENPOT_SMTP_SSL=false
    volumes:
      - penpot_assets:/opt/data/assets

  penpot-exporter:
    image: penpotapp/exporter:latest
    restart: always
    environment:
      - PENPOT_PUBLIC_URI=http://penpot-frontend
      - PENPOT_REDIS_URI=redis://penpot-redis/0

  penpot-postgres:
    image: postgres:15
    restart: always
    environment:
      - POSTGRES_INITDB_ARGS=--data-checksums
      - POSTGRES_DB=penpot
      - POSTGRES_USER=penpot
      - POSTGRES_PASSWORD=penpot
    volumes:
      - penpot_postgres:/var/lib/postgresql/data

  penpot-redis:
    image: redis:7
    restart: always

  penpot-mailcatch:
    image: sj26/mailcatcher:latest
    restart: always
    expose:
      - "1025"

volumes:
  penpot_assets:
  penpot_postgres:
